site_name: BridgeSessions
site_description: Persistent shells, verified files, and desktop automation on a pinned peer mesh.
site_url: https://minddragonlabs.github.io/BridgeSessions
repo_url: https://github.com/MindDragonLabs/BridgeSessions
repo_name: MindDragonLabs/BridgeSessions
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Design: design.md
  - Protocol: protocol.md
  - Computer Use: cua.md
  - Bridge Panel: bridge-panel.md
  - Building: building.md
  - E2E Framework: E2E-FRAMEWORK.md
  - Release Provenance: RELEASE-PROVENANCE.md
  - Why BridgeSessions: why-bridge-sessions.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
