# BridgeSessions CI — Codeberg Woodpecker
# Builds + tests on Linux, cross-compiles Windows PE, builds macOS (if runner available)

steps:
  # ── Linux build + test ──────────────────────────────────────
  - name: build-linux
    image: archlinux:latest
    pull: true
    commands:
      - pacman -Sy --noconfirm --needed cmake ninja gcc fmt spdlog zstd openssl catch2 nlohmann-json
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build --parallel
      - ctest --test-dir build --output-on-failure --exclude-regex "test_tls$"

  # ── Windows cross-compile ───────────────────────────────────
  - name: cross-compile-windows
    image: archlinux:latest
    pull: true
    commands:
      - pacman -Sy --noconfirm --needed mingw-w64-gcc
      - >
        x86_64-w64-mingw32-g++ -std=c++23 -s -O2 -static
        -DBS_NO_WEBRTC -DBS_NO_DHT -DBS_NO_NAT
        -I ~/bs-win/include
        main.cpp
        -o dist/bridgesessions-windows-x86_64.exe
        -lssl -lcrypto -lzstd -lfmt -lspdlog
        -lws2_32 -lsecur32 -lcrypt32 -lbcrypt -lncrypt
        -L ~/bs-win/lib -L ~/bs-win/lib64
        -lstdc++ -lm -lwinpthread
    when:
      event: tag

  # ── Generate checksums on tag ───────────────────────────────
  - name: release-checksums
    image: archlinux:latest
    commands:
      - cd dist && sha256sum bridgesessions-* > SHA256SUMS
    when:
      event: tag

  # ── macOS build (self-hosted or skip) ───────────────────────
