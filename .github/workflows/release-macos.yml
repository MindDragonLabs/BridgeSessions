# release-macos.yml — signed macOS arm64 release builds on GitHub-hosted runners.
#
# Replaces the macmini signing host (currently offline) per the 2026-08-31
# decision: "use github ci runners until we can get something else running."
#
# Pipeline: static arm64 build -> Developer ID sign (no ad-hoc fallback) ->
# verify TeamIdentifier -> sha256 -> workflow artifact.
# NOT attached to GitHub Releases by this workflow; release attachment stays
# with scripts/github-release.sh until this pipeline has a green track record.
#
# Triggers are restricted to manual dispatch and v* tag pushes: fork PRs can
# never run this workflow, and secrets are only ever exposed to this job.
#
# Required repo secrets:
#   MACOS_SIGNING_P12_B64      — base64 of the Developer ID Application .p12
#   MACOS_SIGNING_P12_PASSWORD — the p12 export password

name: release-macos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-macos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sign-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja fmt spdlog zstd openssl@3 catch2 nlohmann-json cli11

      - name: Static arm64 build (zero Homebrew dylibs)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBRIDGESESSIONS_PYTHON=OFF \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -Dfmt_DIR="$(brew --prefix fmt)/lib/cmake/fmt" \
            -Dspdlog_DIR="$(brew --prefix spdlog)/lib/cmake/spdlog"
          cmake --build build --parallel
          DYLIBS=$(otool -L build/bridgesessions | grep -c '/opt/homebrew' || true)
          echo "homebrew dylib references: ${DYLIBS}"
          [ "${DYLIBS}" -eq 0 ]
