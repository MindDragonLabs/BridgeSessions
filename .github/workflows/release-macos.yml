# release-macos.yml — signed macOS arm64 release builds on GitHub-hosted runners.
#
# Replaces the macmini signing host (currently offline) per the 2026-08-31
# decision: "use github ci runners until we can get something else running."
#
# Pipeline: static arm64 build -> Developer ID sign (no ad-hoc fallback) ->
# verify TeamIdentifier -> sha256 -> workflow artifact.
# NOT attached to GitHub Releases by this workflow; release attachment stays
# with scripts/github-release.sh until this pipeline has a green track record.
#
# Triggers are restricted to manual dispatch and v* tag pushes: fork PRs can
# never run this workflow, and secrets are only ever exposed to this job.
#
# Required repo secrets:
#   MACOS_SIGNING_P12_B64      — base64 of the Developer ID Application .p12
#   MACOS_SIGNING_P12_PASSWORD — the p12 export password

name: release-macos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-macos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    steps:
      - name: Import Developer ID identity into job keychain
        env:
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/bs-sign.keychain"
          KC_PW="kc-${{ github.run_id }}"
          echo "expr-check: keychain ${KC} pw=${KC_PW} p12len=${#MACOS_SIGNING_P12_B64}"
