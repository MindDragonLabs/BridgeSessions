# GitHub Actions CI — primary pipeline for BridgeSessions
# Builds + tests on Linux, cross-compiles Windows PE on tags, publishes release artifacts

name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*', '26.*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed cmake ninja gcc fmt spdlog zstd \
            openssl catch2 nlohmann-json cli11 python python-pytest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --exclude-regex "test_tls$"

  cross-compile-windows:
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: pacman -Sy --noconfirm --needed mingw-w64-gcc
      - name: Cross-compile Windows PE
        run: |
          x86_64-w64-mingw32-g++ -std=c++23 -s -O2 -static \
            -DBS_NO_WEBRTC -DBS_NO_DHT -DBS_NO_NAT \
            -DBS_VERSION="${{ github.ref_name }}" \
            main.cpp \
            -o dist/bridgesessions-windows-x86_64.exe \
            -lssl -lcrypto -lzstd -lfmt -lspdlog \
            -lws2_32 -lsecur32 -lcrypt32 -lbcrypt -lncrypt \
            -lstdc++ -lm -lwinpthread
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgesessions-windows-x86_64
          path: dist/bridgesessions-windows-x86_64.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, cross-compile-windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: bridgesessions-windows-x86_64
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum bridgesessions-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bridgesessions-windows-x86_64.exe
            dist/SHA256SUMS
          draft: true
          generate_release_notes: true
