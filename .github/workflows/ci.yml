name: CI

# Replaces the removed workflow set. Design goals, in order:
#   1. It passes. A red main is worse than no CI.
#   2. It proves the artifact is portable — that is the bug class that shipped
#      in 26.09.10-r1 (a Linux binary that would not load on Arch).
#   3. It builds the same way a developer does, through ./build.sh, so CI and
#      local builds cannot drift.
#
# Deliberately absent: CodeQL. It cannot run until the repo is public with
# Actions enabled and it was the main source of the previous always-red state.
# The required checks in the `main-trunk-protection` ruleset must match the job
# names below exactly.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Linux: both ends of the supported floor ───────────────────────────────
  linux:
    name: linux-${{ matrix.distro }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc. This is the release artifact's floor.
          - distro: ubuntu-22.04
            runner: ubuntu-22.04
          # Newest supported. Catches new-compiler warnings and C++23 drift.
          - distro: ubuntu-24.04
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libssl-dev zlib1g-dev python3-pip python3-venv
          # Ubuntu 22.04 ships GCC 11, whose libstdc++ has no <expected>
          # (C++23). Install gcc-12 where the distro offers it — the same
          # fallback the container bootstrap uses — or the native build
          # cannot compile at all.
          if apt-cache show g++-12 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends g++-12 gcc-12
            echo "CC=gcc-12" >> "$GITHUB_ENV"
            echo "CXX=g++-12" >> "$GITHUB_ENV"
          fi

      # A venv keeps pytest off the distro Python: Ubuntu 24.04 and macOS mark
      # their system Python externally managed (PEP 668), so `pip install
      # --user` hard-fails there. CMake resolves python3 from PATH and only
      # registers the Python tests when that interpreter can import pytest,
      # so the venv has to be on PATH before the configure step.
      - name: Create Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Ensure CMake >= 3.25
        run: |
          need=3.25
          have=$(cmake --version | head -1 | awk '{print $3}')
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "cmake $have is too old; installing 3.28.3"
            python3 -m pip install --quiet cmake==3.28.3
          fi
          cmake --version | head -1

      - name: Install Python test dependencies
        run: python3 -m pip install --quiet pytest pytest-timeout

      # MeshController loads the node identity from ~/.bridgesessions when it is
      # constructed, and the mesh-backed tests build one. A fresh runner has no
      # identity, so those tests fail with
      #   load key: /home/runner/.bridgesessions/id_ed25519.pem
      # while passing on any developer box that already runs the daemon — a
      # hidden dependency on machine state. Seed one with the project's own
      # keygen. Both steps share one build directory so seeding does not cost a
      # second dependency build.
      - name: Configure and build
        env:
          BS_BUILD_SUBDIR: linux-x86_64
        run: ./build.sh linux --distro native --out dist --no-tests

      - name: Seed a node identity for the mesh tests
        run: ./dist/bridgesessions-linux-x86_64 keygen

      - name: Run the test suite
        env:
          BS_BUILD_SUBDIR: linux-x86_64
        run: ./build.sh test

      - name: Artifact must load on a clean host
        run: |
          set -euo pipefail
          bin=dist/bridgesessions-linux-x86_64
          test -x "$bin"
          echo "--- ldd ---"
          ldd "$bin"
          missing=$(ldd "$bin" | grep -c 'not found' || true)
          if [ "$missing" != "0" ]; then
            echo "::error::$bin has $missing unresolved shared libraries"
            ldd "$bin" | grep 'not found'
            exit 1
          fi
          echo "--- version ---"
          "$bin" --version
          echo "--- newest symbol required ---"
          objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1

      # The release artifact is built in ubuntu:22.04 so it carries the lowest
      # glibc floor. That is a build-only step: the suite runs natively above,
      # because a stripped container is a cross-compile environment, not a test
      # environment (the socket/timing tests flake there and pass natively).
      - name: Portable release artifact (ubuntu:22.04 floor)
        run: |
          set -euo pipefail
          ./build.sh linux --distro ubuntu:22.04 --no-tests --out dist
          bin=dist/bridgesessions-linux-x86_64
          missing=$(ldd "$bin" | grep -c 'not found' || true)
          echo "unresolved=$missing"
          [ "$missing" = "0" ]
          "$bin" --version

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgesessions-linux-${{ matrix.distro }}
          path: dist/bridgesessions-linux-x86_64
          if-no-files-found: error

  # ── macOS ─────────────────────────────────────────────────────────────────
  macos:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macOS runners ship an externally managed Python (PEP 668), so
      # `pip install --user` fails outright. A venv first on PATH keeps both
      # cmake and pytest off the system interpreter; CMake resolves python3
      # from PATH and only registers the Python tests when that interpreter
      # can import pytest.
      - name: Create Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Ensure CMake >= 3.25
        run: |
          need=3.25
          have=$(cmake --version | head -1 | awk '{print $3}')
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            python3 -m pip install --quiet cmake==3.28.3
          fi
          cmake --version | head -1

      - name: Install Python test dependencies
        run: python3 -m pip install --quiet pytest pytest-timeout

      # Same node-identity prerequisite as the Linux jobs: MeshController loads
      # ~/.bridgesessions at construction and a fresh runner has no identity, so
      # the mesh-backed tests fail with "load key". Seed one with keygen, reusing
      # the same build directory the test run reconfigures.
      - name: Configure and build
        env:
          BS_BUILD_SUBDIR: macos-arm64
        run: ./build.sh macos --out dist --no-tests

      - name: Seed a node identity for the mesh tests
        run: ./dist/bridgesessions-macos-arm64 keygen

      - name: Run the test suite
        env:
          BS_BUILD_SUBDIR: macos-arm64
        run: ./build.sh test

      - name: Artifact must load on a clean host
        run: |
          set -euo pipefail
          bin=dist/bridgesessions-macos-arm64
          test -x "$bin"
          echo "--- otool -L ---"
          otool -L "$bin"
          # Only system libraries are allowed.
          if otool -L "$bin" | tail -n +2 | grep -vE \
              '/usr/lib/|/System/Library/|@rpath/libc\+\+|@executable_path'; then
            echo "::error::$bin links a non-system library"
            exit 1
          fi
          echo "--- version ---"
          "$bin" --version

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgesessions-macos-arm64
          path: dist/bridgesessions-macos-arm64
          if-no-files-found: error

  # ── Windows (mingw-w64 cross-compile) ─────────────────────────────────────
  # Build only, then assert the PE imports nothing but OS DLLs. Running the
  # binary under wine was the flakiest part of the old CI; real execution is
  # covered on the live mesh instead.
  windows:
    name: windows-mingw
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config ca-certificates wget xz-utils \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Ensure CMake >= 3.25
        run: |
          need=3.25
          have=$(cmake --version | head -1 | awk '{print $3}')
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            python3 -m pip install --user --quiet cmake==3.28.3
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          cmake --version | head -1

      # OpenSSL is the only dependency that cannot come from the host: a Linux
      # libssl would produce a Linux binary. This builds the static mingw prefix.
      - name: Build static mingw dependency prefix
        run: bash scripts/ci-win-deps.sh "$RUNNER_TEMP/bs-win"

      - name: Configure and build
        env:
          BS_WIN_PREFIX: ${{ runner.temp }}/bs-win
        run: ./build.sh windows --out dist --no-tests

      - name: PE imports must be OS DLLs only
        run: |
          set -euo pipefail
          exe=dist/bridgesessions-windows-x86_64.exe
          test -f "$exe"
          echo "--- DLL imports ---"
          imports=$(x86_64-w64-mingw32-objdump -p "$exe" | grep 'DLL Name' | sort -u)
          echo "$imports"
          # 'grep -v' exits 1 when it excludes nothing, and with pipefail that
          # aborts the step even though every import is allowed. Capture the
          # filtered list instead of counting it.
          bad=$(printf '%s\n' "$imports" | grep -viE 'kernel32|user32|gdi32|advapi32|ws2_32|crypt32|shell32|ole32|oleaut32|api-ms-win|ucrtbase|msvcrt|winpthread|secur32|iphlpapi|bcrypt|ncrypt|setupapi|cfgmgr32|version|normaliz|dbghelp' || true)
          if [ -n "$bad" ]; then
            echo "::error::$exe imports non-OS DLL(s):"
            echo "$bad"
            exit 1
          fi
          echo "--- size ---"
          ls -l "$exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgesessions-windows-x86_64
          path: dist/bridgesessions-windows-x86_64.exe
          if-no-files-found: error

  # ── Secret scan ───────────────────────────────────────────────────────────
  # Required by the main-trunk-protection ruleset. Scans tracked files only.
  secrets:
    name: secrets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver=8.21.2
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          curl -fsSL -o /tmp/gitleaks.tgz \
            "${base}/gitleaks_${ver}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history
        run: gitleaks detect --no-banner --redact --verbose
