name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*', '26.*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed cmake ninja gcc fmt spdlog zstd \
            openssl catch2 nlohmann-json cli11 python python-pytest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRIDGESESSIONS_PYTHON=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --exclude-regex "test_tls$"

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          # Ignore untrusted third-party taps noise; only install from homebrew/core.
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja fmt spdlog zstd openssl@3 catch2 nlohmann-json cli11
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRIDGESESSIONS_PYTHON=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --exclude-regex "test_tls$"
