name: Release

# Cut a release by pushing a tag. The tag must match VERSION and the tree must
# be clean; scripts/github-release.sh enforces both, and this workflow re-checks
# so a bad tag fails fast instead of publishing half an artifact set.
#
#   git tag v26.09.15 && git push origin v26.09.15

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish'
        required: true

permissions:
  contents: write

jobs:
  guard:
    name: verify tag and version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v${version}" != "$tag" ]; then
            echo "::error::tag $tag does not match VERSION ($version)"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tree is dirty"
            exit 1
          fi

  linux:
    name: linux (release artifact)
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libssl-dev zlib1g-dev python3-pip python3-venv
          # Ubuntu 22.04 ships GCC 11, whose libstdc++ has no <expected>
          # (C++23) — the release binary cannot even compile. Install gcc-12
          # where the distro offers it, same fallback as ci.yml.
          if apt-cache show g++-12 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends g++-12 gcc-12
            echo "CC=gcc-12" >> "$GITHUB_ENV"
            echo "CXX=g++-12" >> "$GITHUB_ENV"
          fi
      # venv keeps pytest off the distro Python (PEP 668 makes `pip install
      # --user` hard-fail). Must be on PATH before the configure step.
      - name: Create Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install --quiet pytest pytest-timeout
      # Same order as ci.yml: build without tests, seed a node identity, then
      # run the suite. The mesh-backed tests (Ctrl-C delivery, cua signal)
      # construct a MeshController, which loads ~/.bridgesessions identity —
      # a fresh runner has none, and those tests fail deterministically
      # without it. --repeat until-pass cannot save a deterministic miss.
      - name: Configure and build
        env:
          BS_BUILD_SUBDIR: linux-x86_64
        run: ./build.sh linux --distro native --out dist --no-tests
      - name: Seed a node identity for the mesh tests
        run: ./dist/bridgesessions-linux-x86_64 keygen
      - name: Run the test suite
        env:
          BS_BUILD_SUBDIR: linux-x86_64
        run: ./build.sh test
      - run: |
          bin=dist/bridgesessions-linux-x86_64
          ldd "$bin" | grep 'not found' && exit 1 || true
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: rel-linux
          path: dist/bridgesessions-linux-x86_64
          if-no-files-found: error

  macos:
    name: macos (release artifact)
    needs: guard
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # macOS runners ship an externally managed Python (PEP 668) — pip
      # --user fails outright. venv first on PATH, same as ci.yml.
      - name: Create Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install --quiet pytest pytest-timeout
      - run: ./build.sh macos --out dist
      - run: |
          bin=dist/bridgesessions-macos-arm64
          otool -L "$bin"
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: rel-macos
          path: dist/bridgesessions-macos-arm64
          if-no-files-found: error

  windows:
    name: windows (release artifact)
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config ca-certificates wget xz-utils \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - run: bash scripts/ci-win-deps.sh "$RUNNER_TEMP/bs-win"
      - env:
          BS_WIN_PREFIX: ${{ runner.temp }}/bs-win
        run: ./build.sh windows --out dist --no-tests
      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows
          path: |
            dist/bridgesessions-windows-x86_64.exe
            dist/bs_tray.ps1
          if-no-files-found: error

  windows-installer-validation:
    name: windows installer validation
    needs: guard
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and enforce safe upgrade ordering
        shell: pwsh
        run: ./tests/test_install_order.ps1

  publish:
    name: publish
    needs: [guard, linux, macos, windows, windows-installer-validation]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add source archives
        run: |
          set -euo pipefail
          v="${{ needs.guard.outputs.version }}"
          git archive --format=tar.gz --prefix="bridgesessions-${v}/" \
            -o "dist/bridgesessions-${v}-source.tar.gz" HEAD
          git archive --format=zip --prefix="bridgesessions-${v}/" \
            -o "dist/bridgesessions-${v}-source.zip" HEAD
      - name: Checksums and SBOM
        # release-checksums.sh validates every artifact's embedded version,
        # writes SHA256SUMS (artifacts + SBOM hash; never itself), and the
        # CycloneDX SBOM, then re-verifies with sha256sum -c. The old inline
        # "Checksums" step overwrote this file with `sha256sum ./* > SHA256SUMS`,
        # which truncated SHA256SUMS before reading it (self-line hashed empty)
        # and included no post-write verification. No || true — a bad artifact
        # set must fail the publish, not ship.
        run: bash scripts/release-checksums.sh --sbom dist/SBOM-binaries.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.guard.outputs.tag }}"
          # Idempotent publish: if the release already exists (e.g. it was
          # created manually first, or the workflow is re-run), upload-or-
          # replace assets instead of failing on the duplicate tag.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists — removing stale assets, then uploading"
            # Drop assets not in this run's dist/ so SHA256SUMS/SBOM always
            # cover exactly the published set (no orphaned old artifacts).
            comm -23 \
              <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.[].name' | sort) \
              <(cd dist && printf '%s\n' ./* | sed 's#^\./##' | sort) \
              | while IFS= read -r stale; do
                  [ -n "$stale" ] || continue
                  echo "deleting stale asset: $stale"
                  gh release delete-asset "$tag" "$stale" \
                    --repo "$GITHUB_REPOSITORY" --yes || true
                done
            gh release upload "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "BridgeSessions ${{ needs.guard.outputs.version }}" \
              --generate-notes
          fi
