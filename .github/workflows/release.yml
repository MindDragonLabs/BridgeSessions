name: Release

# Cut a release by pushing a tag. The tag must match VERSION and the tree must
# be clean; scripts/github-release.sh enforces both, and this workflow re-checks
# so a bad tag fails fast instead of publishing half an artifact set.
#
#   git tag v26.09.15 && git push origin v26.09.15

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish'
        required: true

permissions:
  contents: write

jobs:
  guard:
    name: verify tag and version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "::error::invalid release tag syntax"
            exit 1
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          git checkout --detach "$commit"
          version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "v${version}" != "$tag" ]; then
            echo "::error::tag $tag does not match VERSION ($version)"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tree is dirty"
            exit 1
          fi

  linux:
    name: linux (release artifact)
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libssl-dev zlib1g-dev python3-pip python3-venv
          # Ubuntu 22.04 ships GCC 11, whose libstdc++ has no <expected>
          # (C++23) — the release binary cannot even compile. Install gcc-12
          # where the distro offers it, same fallback as ci.yml.
          if apt-cache show g++-12 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends g++-12 gcc-12
            echo "CC=gcc-12" >> "$GITHUB_ENV"
            echo "CXX=g++-12" >> "$GITHUB_ENV"
          fi
      # venv keeps pytest off the distro Python (PEP 668 makes `pip install
      # --user` hard-fail). Must be on PATH before the configure step.
      - name: Create Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install --quiet pytest pytest-timeout
      # Same order as ci.yml: build without tests, seed a node identity, then
      # run the suite. The mesh-backed tests (Ctrl-C delivery, cua signal)
      # construct a MeshController, which loads ~/.bridgesessions identity —
      # a fresh runner has none, and those tests fail deterministically
      # without it. --repeat until-pass cannot save a deterministic miss.
      - name: Configure and build
        env:
          BS_BUILD_SUBDIR: linux-x86_64
        run: ./build.sh linux --distro native --openssl fetch --out dist --no-tests
      - name: Seed a node identity for the mesh tests
        run: ./dist/bridgesessions-linux-x86_64 keygen
      - name: Run the test suite
        env:
          BS_BUILD_SUBDIR: linux-x86_64
        run: ./build.sh test
      - run: |
          bin=dist/bridgesessions-linux-x86_64
          file "$bin" | grep -E 'ELF 64-bit LSB.*x86-64' >/dev/null
          ldd "$bin" > "$RUNNER_TEMP/bridgesessions-ldd.txt"
          if grep -F 'not found' "$RUNNER_TEMP/bridgesessions-ldd.txt"; then
            echo "unresolved Linux shared-library dependency" >&2
            exit 1
          fi
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: rel-linux
          path: dist/bridgesessions-linux-x86_64
          if-no-files-found: error

  macos:
    name: macos (release artifact)
    needs: guard
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      # macOS runners ship an externally managed Python (PEP 668) — pip
      # --user fails outright. venv first on PATH, same as ci.yml.
      - name: Create Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install --quiet pytest pytest-timeout
      - run: ./build.sh macos --out dist
      - name: Import Developer ID certificate
        env:
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_P12_B64:?missing MACOS_SIGNING_P12_B64 secret}"
          : "${MACOS_SIGNING_P12_PASSWORD:?missing MACOS_SIGNING_P12_PASSWORD secret}"
          cert="$RUNNER_TEMP/bridgesessions-signing.p12"
          keychain="$RUNNER_TEMP/bridgesessions-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_SIGNING_P12_B64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          login_keychain="$(security list-keychains -d user \
            | sed -n '1{s/^ *"\(.*\)"$/\1/p;}')"
          : "${login_keychain:?login keychain not found on runner}"
          security list-keychains -d user -s "$keychain" "$login_keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE '/Developer ID Application/s/.*"([^"]+)".*/\1/p' | head -1)"
          : "${identity:?no valid Developer ID Application identity in certificate}"
          echo "BS_DEV_ID=$identity" >> "$GITHUB_ENV"
      - name: Sign and notarize macOS release artifact
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_KEY_ID:?missing APP_STORE_CONNECT_KEY_ID secret}"
          : "${APP_STORE_CONNECT_ISSUER:?missing APP_STORE_CONNECT_ISSUER secret}"
          : "${APP_STORE_CONNECT_KEY_P8:?missing APP_STORE_CONNECT_KEY_P8 secret}"
          key_file="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY_P8" > "$key_file"
          chmod 600 "$key_file"
          export APP_STORE_CONNECT_KEY_FILE="$key_file"
          ./scripts/notarize-macos.sh \
            dist/bridgesessions-macos-arm64 \
            dist/bridgesessions-macos-arm64
      - run: |
          bin=dist/bridgesessions-macos-arm64
          deps="$(otool -L "$bin")"
          printf '%s\n' "$deps"
          if printf '%s\n' "$deps" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)' ; then
            echo "unexpected non-system macOS dependency" >&2
            exit 1
          fi
          file "$bin" | grep -E 'Mach-O 64-bit.*arm64' >/dev/null
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: rel-macos
          path: dist/bridgesessions-macos-arm64
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/bridgesessions-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/bridgesessions-signing.p12" \
            "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID:-unknown}.p8" \
            /tmp/bridgesessions-notarize.zip /tmp/bridgesessions-standalone-signed

  windows:
    name: windows (release artifact)
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config ca-certificates wget xz-utils \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - run: bash scripts/ci-win-deps.sh "$RUNNER_TEMP/bs-win"
      - env:
          BS_WIN_PREFIX: ${{ runner.temp }}/bs-win
        run: ./build.sh windows --out dist --no-tests
      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows
          path: |
            dist/bridgesessions-windows-x86_64.exe
            dist/bs_tray.ps1
          if-no-files-found: error

  windows-installer-validation:
    name: windows installer validation
    needs: guard
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - name: Parse installer and enforce safe upgrade ordering
        shell: pwsh
        run: ./tests/test_install_order.ps1

  publish:
    name: publish
    needs: [guard, linux, macos, windows, windows-installer-validation]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add source archives
        run: |
          set -euo pipefail
          v="${{ needs.guard.outputs.version }}"
          commit="${{ needs.guard.outputs.commit }}"
          git archive --format=tar.gz --prefix="bridgesessions-${v}/" \
            -o "dist/bridgesessions-${v}-source.tar.gz" "$commit"
          git archive --format=zip --prefix="bridgesessions-${v}/" \
            -o "dist/bridgesessions-${v}-source.zip" "$commit"
      - name: Restore exec bits
        # actions/upload-artifact zips files and drops permissions; the release
        # binaries must ship executable (release-checksums.sh guards this).
        run: chmod +x dist/bridgesessions-linux-x86_64 dist/bridgesessions-macos-arm64
      - name: Checksums and SBOM
        # release-checksums.sh validates every artifact's embedded version,
        # writes SHA256SUMS (artifacts + SBOM hash; never itself), and the
        # CycloneDX SBOM, then re-verifies with sha256sum -c. The old inline
        # "Checksums" step overwrote this file with `sha256sum ./* > SHA256SUMS`,
        # which truncated SHA256SUMS before reading it (self-line hashed empty)
        # and included no post-write verification. No || true — a bad artifact
        # set must fail the publish, not ship.
        run: bash scripts/release-checksums.sh --sbom dist/SBOM-binaries.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.guard.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            python3 - dist "$existing" <<'PY'
          import pathlib, sys
          expected = pathlib.Path(sys.argv[1])
          published = pathlib.Path(sys.argv[2])
          def files(directory):
              return {p.name: p.read_bytes() for p in directory.iterdir() if p.is_file()}
          a, b = files(expected), files(published)
          if a.keys() != b.keys():
              raise SystemExit(f"existing release asset names differ; refusing overwrite: expected={sorted(a)} published={sorted(b)}")
          changed = sorted(name for name in a if a[name] != b[name])
          if changed:
              raise SystemExit(f"existing release has different content; refusing overwrite: {changed}")
          print("Existing release assets exactly match this build; leaving release unchanged.")
          PY
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "BridgeSessions ${{ needs.guard.outputs.version }}" \
              --generate-notes
          fi
