version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Ubuntu 22.04 is the deliberate glibc compatibility floor.
      - dependency-name: ubuntu
