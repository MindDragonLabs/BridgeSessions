# BridgeSessions e2e matrix — run on work completion (not nightly)
# Peer names are placeholders. Override for a real lab with:
#   BS_E2E_PEERS, BS_E2E_PEER_WIN, BS_E2E_PEER_MAC
version: 1
expected_version: "26.08.12-beta3"

layers:
  L2:
    description: Mesh CLI feature matrix
    required: true
  L3:
    description: Desktop CUA, tray, menubar
    required: true
  L4:
    description: Foreground installer on clean guest
    required: false  # enable when clean VM snapshot ready

peers:
  mesh:
    - peer-linux-a
    - peer-linux-b
    - peer-mac
    - peer-win
  linux_desktop: bs-qa-ubuntu   # KVM guest (when joined)
  windows_desktop: peer-win
  macos_desktop: peer-mac

suites:
  mesh_core:
    layer: L2
    required: true
    entry: scripts/e2e-fleet-test.sh
  cua_linux_desktop:
    layer: L3
    required: true
    needs: [linux_desktop_display]
    peer: bs-qa-ubuntu
  cua_windows:
    layer: L3
    required: true
    needs: [windows_session1_helper]
    peer: peer-win
  cua_macos:
    layer: L3
    required: true
    needs: [macos_cua_helper]
    peer: peer-mac
  tray_linux:
    layer: L3
    required: true
    needs: [linux_desktop_display]
    peer: bs-qa-ubuntu
  tray_windows:
    layer: L3
    required: true
    needs: [windows_session1]
    peer: peer-win
  menubar_macos:
    layer: L3
    required: true
    peer: peer-mac
  installer_linux:
    layer: L4
    required: false
    needs: [clean_linux_vm]
